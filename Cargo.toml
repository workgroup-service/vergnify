# @author Cursor

[workspace]
resolver = "2"
members = [
    "crates/vergnify-core",
    "crates/vergnify-cli",
    "crates/vergnify-gui",
    "crates/vergnify-agent",
]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
cvss = "3"
notify-rust = "4"
reqwest = { version = "0.12", features = ["json"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
